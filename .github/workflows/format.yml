name: Format

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run autofmt
        uses: area44/autofmt-action@d2c585d7e412b237cde77b054c680835fc5d3999 # v0.1.0
